name: CI and CD

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RACK_ENV: test
      RAILS_ENV: test
      DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1/laa-assure-hmrc-data-test"

    services:
      postgres:
        image: postgres:18.3-alpine
        env:
          POSTGRES_DB: laa-assure-hmrc-data-test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      clamav:
        image: clamav/clamav-debian:stable
        ports:
          - 3310:3310

    steps:
      - &checkout-code
        name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #--v7.0.1

      - name: Setup Ruby and install gems
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b #--v1.321.0
        with:
          bundler-cache: true

      - name: Find yarn cache location
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - name: JS package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install packages with yarn
        run: yarn install --immutable

      - name: Precompile assets
        run: bin/rails assets:precompile

      - name: Setup test database
        run: bin/rails db:prepare

      - name: Run linters
        run: |
          bundle exec rubocop
          bundle exec rake erb_lint
          yarn run standardjs
          yarn run stylelint

      - name: Install clamav client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clamdscan

      - name: Run tests
        run: bundle exec rspec

      - name: Archive code coverage results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage
          retention-days: 7

  build:
    if: github.actor != 'dependabot[bot]'
    needs: test
    runs-on: ubuntu-latest

    permissions:
      id-token: write

    outputs:
      image: ${{ steps.build_and_push.outputs.image }}
      branch-name: ${{ steps.build_and_push.outputs.branch-name }}
      release-name: ${{ steps.build_and_push.outputs.release-name }}

    steps:
      - *checkout-code

      - name: Build and push
        id: build_and_push
        uses: ministryofjustice/laa-civil-apply-build-and-push@8a157dbc3ec3b1d2366d6a676272cc26a57e9439 # main as at 21/08/2026
        with:
          ecr-region: ${{ vars.ECR_REGION }}
          ecr-role-to-assume: ${{ secrets.ECR_ROLE_TO_ASSUME }}
          ecr-repository: ${{ vars.ECR_REPOSITORY }}

  deploy-uat:
    runs-on: ubuntu-latest
    needs: build
    environment: uat
    permissions:
      id-token: write

    steps:
      - *checkout-code

      - name: Deploy UAT branch
        id: deploy_uat_branch
        uses: ministryofjustice/laa-civil-apply-deploy@505f9c7d9a232b8fa1d601344d6d91a67b961def # main as at 21/08/2026
        with:
          ecr-region: ${{ vars.ECR_REGION }}
          ecr-role-to-assume: ${{ secrets.ECR_ROLE_TO_ASSUME }}
          ecr-registry: ${{ vars.ECR_REGISTRY }}
          ecr-repository: ${{ vars.ECR_REPOSITORY }}
          kube-cert: ${{ secrets.KUBE_UAT_CERT }}
          kube-token: ${{ secrets.KUBE_UAT_TOKEN }}
          kube-cluster: ${{ secrets.KUBE_UAT_CLUSTER }}
          kube-namespace: ${{ secrets.KUBE_UAT_NAMESPACE }}
          branch-name: ${{ needs.build.outputs.branch-name }}
          release-name: ${{ needs.build.outputs.release-name }}
          script-path: ./bin/deploy
          app-environment: uat

  deploy-staging:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    environment: staging
    permissions:
      id-token: write

    steps:
      - *checkout-code

      - name: Deploy Staging branch
        id: deploy_staging_branch
        uses: ministryofjustice/laa-civil-apply-deploy@505f9c7d9a232b8fa1d601344d6d91a67b961def # main as at 21/08/2026
        with:
          ecr-region: ${{ vars.ECR_REGION }}
          ecr-role-to-assume: ${{ secrets.ECR_ROLE_TO_ASSUME }}
          ecr-registry: ${{ vars.ECR_REGISTRY }}
          ecr-repository: ${{ vars.ECR_REPOSITORY }}
          kube-cert: ${{ secrets.KUBE_STAGING_CERT }}
          kube-token: ${{ secrets.KUBE_STAGING_TOKEN }}
          kube-cluster: ${{ secrets.KUBE_STAGING_CLUSTER }}
          kube-namespace: ${{ secrets.KUBE_STAGING_NAMESPACE }}
          script-path: ./bin/deploy
          app-environment: staging

  deploy-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    environment: production
    permissions:
      id-token: write

    steps:
      - *checkout-code

      - name: Deploy Production branch
        id: deploy_production_branch
        uses: ministryofjustice/laa-civil-apply-deploy@505f9c7d9a232b8fa1d601344d6d91a67b961def # main as at 21/08/2026
        with:
          ecr-region: ${{ vars.ECR_REGION }}
          ecr-role-to-assume: ${{ secrets.ECR_ROLE_TO_ASSUME }}
          ecr-registry: ${{ vars.ECR_REGISTRY }}
          ecr-repository: ${{ vars.ECR_REPOSITORY }}
          kube-cert: ${{ secrets.KUBE_PRODUCTION_CERT }}
          kube-token: ${{ secrets.KUBE_PRODUCTION_TOKEN }}
          kube-cluster: ${{ secrets.KUBE_PRODUCTION_CLUSTER }}
          kube-namespace: ${{ secrets.KUBE_PRODUCTION_NAMESPACE }}
          script-path: ./bin/deploy
          app-environment: production
